---
# Build + publish the opendesk-keycloak-bootstrap image to
# ghcr.io/<owner>/opendesk-keycloak-bootstrap-image (i.e. ghcr.io/cosa-systems/...).
# The `-image` suffix keeps it distinct from the Helm chart OCI artifact published at
# ghcr.io/cosa-systems/opendesk-keycloak-bootstrap.
#
# Trigger:
#   * push to `cosa-deploy` (auto-build on every commit there)
#   * workflow_dispatch (manual button)
#
# The tag is read from the VERSION file. Bump its `-cosa.N` suffix to ship a new build.
name: "Build + publish image"

on:
  push:
    branches:
      - "cosa-deploy"
    paths:
      - "bootstrap-opendesk-keycloak/**"
      - "Dockerfile"
      - "VERSION"
      - ".github/workflows/build-image.yaml"
  workflow_dispatch:

permissions:
  contents: "read"
  packages: "write"

jobs:
  build:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Compute image tags"
        id: "meta"
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          version=$(tr -d '[:space:]' < VERSION)
          image="ghcr.io/${owner}/opendesk-keycloak-bootstrap-image"
          echo "tags=${image}:${version},${image}:latest" >> "${GITHUB_OUTPUT}"
          echo "Building ${image}:${version}"

      - name: "Log in to ghcr.io"
        uses: "docker/login-action@v3"
        with:
          registry: "ghcr.io"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Set up Buildx"
        uses: "docker/setup-buildx-action@v3"

      - name: "Build + push"
        uses: "docker/build-push-action@v6"
        with:
          context: "."
          file: "Dockerfile"
          push: true
          tags: "${{ steps.meta.outputs.tags }}"
